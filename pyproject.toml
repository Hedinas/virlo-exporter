[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "virlo-exporter"
version = "0.1.0"
description = "Native Windows client for Virlo Content Research Agents and AI-ready exports"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "platformdirs>=4.3,<5",
]

[project.scripts]
virlo-exporter = "virlo_exporter.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

